[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bbtsha"
version = "0.1.0"
description = "A differentiable, single-block SHA-256 computation in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
